<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #ffffff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #61dafb;
      font-size: 3em;
    }
    p {
      font-size: 1.2em;
      color: #cccccc;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #61dafb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #1e1e2f;
      font-weight: bold;
    }
    button:hover {
      background-color: #4fc3e8;
    }
  </style>
</head>
<body>
  <h1>Hello, World! 🚀</h1>
  <p>This is my very first website, built with HTML and pushed with Git!</p>
  <button onclick="alert('You just clicked a button on your own website!')">Click Me</button>
</body>
</html>
